    .colorful-card {

      -webkit-box-orient: vertical;

    /* ---- animated backdrop ---- */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      background: #06050f;
    }
    .bg-scene::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 85%);
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 85%);
    }
    .blob {
      position: absolute;
      border-radius: 9999px;
      filter: blur(90px);
      mix-blend-mode: screen;
      will-change: transform;
    }
    .blob-1 { width: 34rem; height: 34rem; top: -9rem; left: -7rem; opacity: .5; background: radial-gradient(circle, #6366f1, transparent 70%); animation: drift-a 24s ease-in-out infinite; }
    .blob-2 { width: 30rem; height: 30rem; bottom: -10rem; right: -6rem; opacity: .45; background: radial-gradient(circle, #a855f7, transparent 70%); animation: drift-b 28s ease-in-out infinite; }
    .blob-3 { width: 24rem; height: 24rem; top: 38%; left: 55%; opacity: .3; background: radial-gradient(circle, #fb7185, transparent 70%); animation: drift-c 20s ease-in-out infinite; }

    @keyframes drift-a { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60px, 80px) scale(1.15); } }
    @keyframes drift-b { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-70px, -50px) scale(1.1); } }
    @keyframes drift-c { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-40px, 40px) scale(1.2); } }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid rgba(129, 140, 248, .8);
      outline-offset: 2px;
      border-radius: 4px;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, .35); border-radius: 999px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }

    // Maps a lowercase tag to a brand icon (served via the Simple Icons CDN) or a Lucide icon.
    const TECH_ICON_MAP = {
      typescript:     { type: 'brand',  slug: 'typescript',  color: '#3178C6' },
      javascript:     { type: 'brand',  slug: 'javascript',  color: '#F7DF1E' },
      html:           { type: 'brand',  slug: 'html5',       color: '#E34F26' },

      vercel:         { type: 'brand',  slug: 'vercel',      color: '#FFFFFF' },
      tailwindcss:    { type: 'brand',  slug: 'tailwindcss', color: '#06B6D4' },

      cloudflare:     { type: 'brand',  slug: 'cloudflare',  color: '#F38020' },
      'next.js':      { type: 'brand',  slug: 'nextdotjs',   color: '#FFFFFF' },
      github:         { type: 'brand',  slug: 'github',      color: '#FFFFFF' },
      'github api':   { type: 'brand',  slug: 'github',      color: '#FFFFFF' },
      supabase:       { type: 'brand',  slug: 'supabase',    color: '#3FCF8E' },
      'youtube api':  { type: 'brand',  slug: 'youtube',     color: '#FF0000' },
      sql:            { type: 'lucide', icon: 'database',    color: '#4479A1' },
      api:            { type: 'lucide', icon: 'webhook',     color: '#a3a3a3' },
      ai:             { type: 'lucide', icon: 'sparkles',    color: '#f0abfc' },
      reader:         { type: 'lucide', icon: 'book-open',   color: '#a3a3a3' },
      'data viz':     { type: 'lucide', icon: 'bar-chart-3', color: '#a3a3a3' },
      ui:             { type: 'lucide', icon: 'palette',     color: '#a3a3a3' },
      'lucide icons': { type: 'lucide', icon: 'palette',     color: '#a3a3a3' },
      'anya apis':    { type: 'lucide', icon: 'server',      color: '#a3a3a3' },
      saavnxapi:      { type: 'lucide', icon: 'music',       color: '#1ED760' },
    };

    // A nicer, deduplicated label for tags whose source casing is inconsistent (e.g. "Typescript" vs "TypeScript").
    const TAG_LABELS = {
      typescript: 'TypeScript', javascript: 'JavaScript', html: 'HTML', css: 'CSS', js: 'JS',
      react: 'React', vercel: 'Vercel', tailwindcss: 'Tailwind CSS', svelte: 'Svelte',
      cloudflare: 'Cloudflare', 'next.js': 'Next.js', github: 'GitHub', 'github api': 'GitHub API',
      supabase: 'Supabase', 'youtube api': 'YouTube API', sql: 'SQL', api: 'API', ai: 'AI',
      reader: 'Reader', 'data viz': 'Data Viz', ui: 'UI', 'lucide icons': 'Lucide Icons',
      'anya apis': 'Anya APIs', saavnxapi: 'SaavnxAPI',
    };

    function getTechIcon(tag) {
      return TECH_ICON_MAP[tag.trim().toLowerCase()] ?? { type: 'lucide', icon: 'code-2', color: '#a3a3a3' };
    }

    function getTagLabel(tag) {
      return TAG_LABELS[tag.trim().toLowerCase()] ?? tag;
    }

    function techIconHTML(tag, size) {
      const t = getTechIcon(tag);
      if (t.type === 'brand') {
        return `<img src="https://cdn.simpleicons.org/${t.slug}/${t.color.replace('#', '')}" alt="" class="shrink-0" style="width:${size}px;height:${size}px" />`;
      }
      return `<i data-lucide="${t.icon}" class="shrink-0" style="width:${size}px;height:${size}px;color:${t.color}"></i>`;
    }

    let search = '';
    let activeTag = 'All';

    function getAllTags() {
      const seen = new Map();
      allProjects.forEach((p) => p.tags.forEach((t) => {
        const key = t.trim().toLowerCase();
        if (!seen.has(key)) seen.set(key, getTagLabel(t));
      }));
      return ['All', ...Array.from(seen.values()).sort((a, b) => a.localeCompare(b))];
    }

    function getFiltered() {
      const q = search.trim().toLowerCase();
      return allProjects.filter((p) => {
        const matchesTag = activeTag === 'All' || p.tags.some((t) => getTagLabel(t) === activeTag);
        const matchesSearch = !q
          || p.title.toLowerCase().includes(q)
          || p.description.toLowerCase().includes(q)
          || p.tags.some((t) => t.toLowerCase().includes(q));
        return matchesTag && matchesSearch;
      });
    }

    function renderStats() {
      const stats = [
        { icon: 'rocket', label: 'Total Projects', value: allProjects.length, color: 'text-primary' },
        { icon: 'code-2', label: 'Open Source', value: allProjects.filter((p) => !p.isPrivate).length, color: 'text-secondary' },
        { icon: 'sparkles', label: 'Live Now', value: allProjects.length, color: 'text-coral' },
      ];
      document.getElementById('stats').innerHTML = stats.map((s) => `
        <div class="colorful-card p-3 sm:p-5 text-center group hover:scale-105 transition-transform duration-300">
          <i data-lucide="${s.icon}" class="w-5 h-5 sm:w-7 sm:h-7 mx-auto mb-2 ${s.color} group-hover:scale-110 transition-transform"></i>
          <div class="text-2xl sm:text-3xl font-display font-bold text-gradient">${s.value}</div>
          <div class="text-[10px] sm:text-xs text-gray-500 font-code uppercase tracking-wider mt-1">${s.label}</div>
        </div>
      `).join('');
    }

    function renderTagFilters() {
      const wrap = document.getElementById('tag-filters');
      const tags = getAllTags();
      wrap.innerHTML = tags.map((tag) => {
        const active = tag === activeTag;
        const icon = tag !== 'All' ? techIconHTML(tag, 12) : '';
        return `
          <button data-tag="${tag}" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-code rounded-full border transition-all ${
            active
              ? 'bg-gradient-to-r from-primary to-secondary text-white border-transparent shadow-lg scale-105'
              : 'bg-white/5 border-white/10 text-gray-400 hover:border-primary/40 hover:text-primary'
          }">${icon}${tag}</button>`;
      }).join('');

      wrap.querySelectorAll('button[data-tag]').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeTag = btn.dataset.tag;
          renderTagFilters();
          renderProjects();
        });
      });

      if (window.lucide) lucide.createIcons();
    }

    function createProjectCard(project, index) {
      const card = document.createElement('div');
      card.className = 'group glass-card overflow-hidden transition-all duration-500 hover:scale-[1.02] hover:shadow-2xl hover:shadow-primary/20 opacity-0 translate-y-10 rounded-2xl';
      card.style.transitionDelay = `${Math.min(index * 50, 400)}ms`;

      const visibleTags = project.tags.slice(0, 3);
      const extra = project.tags.length - 3;

      card.innerHTML = `
        <div class="relative h-52 overflow-hidden">
          <img
            src="${project.image}"
            alt="${project.title}"
            class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
            loading="lazy"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div>
          ${project.isPrivate ? `
            <div class="absolute top-3 right-3 flex items-center gap-1 px-2 py-1 rounded-full bg-black/70 backdrop-blur-md border border-white/10">
              <i data-lucide="lock" style="width:10px;height:10px" class="text-coral"></i>
              <span class="text-[10px] font-code text-coral uppercase">Private</span>
            </div>` : ''}
        </div>

        <div class="p-5">
          <h3 class="text-xl font-bold text-white mb-2 group-hover:text-primary transition-colors duration-300 font-display">
            ${project.title}
          </h3>

          <p class="text-sm text-gray-400 font-body mb-4 line-clamp-2 leading-relaxed">
            ${project.description}
          </p>

          <div class="flex flex-wrap gap-2 mb-4">
            ${visibleTags.map((tag) => `
              <span class="flex items-center gap-1.5 px-2 py-1 text-xs font-code rounded-full bg-primary/10 text-primary border border-primary/20">
                ${techIconHTML(tag, 12)}${getTagLabel(tag)}
              </span>
            `).join('')}
            ${extra > 0 ? `<span class="px-2 py-1 text-xs font-code rounded-full bg-white/5 text-gray-500">+${extra}</span>` : ''}
          </div>

          <div class="flex gap-3">
            <a
              href="${project.liveUrl}"
              target="_blank"
              rel="noopener noreferrer"
              class="flex-1 flex items-center justify-center gap-2 py-2 px-4 rounded-xl
                     bg-primary/20 border border-primary/30 text-primary hover:bg-primary hover:text-white
                     transition-all duration-300 font-code text-sm hover:shadow-lg"
            >
              <i data-lucide="external-link" class="w-4 h-4"></i>
              View
            </a>
            <a
              href="${project.isPrivate ? '#' : project.sourceUrl}"
              target="${project.isPrivate ? '_self' : '_blank'}"
              rel="noopener noreferrer"
              class="flex-1 flex items-center justify-center gap-2 py-2 px-4 rounded-xl
                     bg-secondary/20 border border-secondary/30 text-secondary transition-all duration-300 font-code text-sm
                     ${project.isPrivate ? 'opacity-50 cursor-not-allowed' : 'hover:bg-secondary hover:text-white hover:shadow-lg'}"
              ${project.isPrivate ? 'onclick="return false;"' : ''}
            >
              <i data-lucide="${project.isPrivate ? 'lock' : 'github'}" class="w-4 h-4"></i>
              ${project.isPrivate ? 'Private' : 'Source'}
            </a>
          </div>
        </div>
      `;

      return card;
    }

    function renderProjects() {
      const grid = document.getElementById('projects-grid');
      const emptyState = document.getElementById('empty-state');
      const filtered = getFiltered();

      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      grid.classList.remove('hidden');
      emptyState.classList.add('hidden');

      filtered.forEach((project, index) => {
        const card = createProjectCard(project, index);
        grid.appendChild(card);

        setTimeout(() => {
          card.classList.remove('opacity-0', 'translate-y-10');
          card.classList.add('opacity-100', 'translate-y-0');
        }, 150 + index * 60);
      });

      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('copyright-year').textContent = `© ${new Date().getFullYear()} Murali. All Rights Reserved.`;

      ['header', 'stats', 'controls'].forEach((id, i) => {
        setTimeout(() => {
          const el = document.getElementById(id);
          el.classList.remove('opacity-0', 'translate-y-10');
          el.classList.add('opacity-100', 'translate-y-0');
        }, 100 + i * 120);
      });

      renderStats();
      renderTagFilters();
      renderProjects();

      document.getElementById('search-input').addEventListener('input', (e) => {
        search = e.target.value;
        renderProjects();
      });

      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
